name: Validate

# Plain-Node validation for this zero-build, dependency-free project.
# No package manager, no npm install, no package.json — just Node running the
# repository's own audit and test scripts.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax-check every JavaScript module
        run: |
          set -e
          for f in js/*.js scripts/*.mjs tests/*.mjs; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Project audit (imports, relative paths, no build artifacts)
        run: node tests/check-project.mjs

      - name: Classification tests (incl. ULA + Firefly, orbit, launch site)
        run: node tests/classification.test.mjs

      - name: Merge / deduplication tests
        run: node tests/merge.test.mjs

      - name: Calendar (.ics) tests
        run: node tests/calendar.test.mjs

      - name: Deep-link tests
        run: node tests/deeplink.test.mjs

      - name: Cache freshness + schema tests
        run: node tests/cache.test.mjs

      - name: Cache-first flow integration
        run: node tests/cache-flow.test.mjs

      - name: Visitor makes no launch-API request
        run: node tests/visitor-requests.test.mjs

      - name: Snapshot validation + fallback order
        run: node tests/snapshot.test.mjs

      - name: Scheduled data workflow script
        run: node tests/fetch-data.test.mjs

      - name: Workflow publish gate (untracked snapshot must commit)
        run: node tests/publish-gate.test.mjs

      - name: Launch API rate-limit handling
        run: node tests/rate-limit.test.mjs

      - name: Automatic refresh + partial-feed protection
        run: node tests/auto-refresh.test.mjs

      - name: API budget (reloads cost nothing)
        run: node tests/api-budget.test.mjs

      - name: Development mirror (debug source only, never a fallback)
        run: node tests/dev-endpoint.test.mjs

      - name: Rolling window anchor + status timing
        run: node tests/refresh-window.test.mjs

      - name: Saved-data banner persistence
        run: node tests/status-persistence.test.mjs

      - name: Presentation polish (images, toast, random mission)
        run: node tests/polish.test.mjs

      - name: Countdown tick (one forced layout per tick, not one per cell)
        run: node tests/countdown-tick.test.mjs

      - name: Audit regressions (URL escaping, aria-live, storage, classification)
        run: node tests/audit-fixes.test.mjs

      - name: Status-banner lifecycle tests
        run: node tests/status.test.mjs

      - name: Organization-color theme tests
        run: node tests/org-colors.test.mjs

      - name: Search-hint (typewriter) lifecycle tests
        run: node tests/search-hint.test.mjs

      - name: API resilience (partial-failure) tests
        run: node tests/api-resilience.test.mjs

      - name: API no-cache retry flow
        run: node tests/api-flow.test.mjs

      - name: Stale-cache fallback flow
        run: node tests/stale-cache.test.mjs

      - name: Duplicate-refresh prevention
        run: node tests/dup-refresh.test.mjs

      - name: Responsive-safety audit
        run: node tests/responsive-audit.test.mjs

      - name: Pagination-control visibility tests
        run: node tests/pagination.test.mjs

      - name: Theme + input-clipping + reduced-motion checks
        run: node tests/theme.test.mjs

      - name: Animation catalog + boot sequence tests
        run: node tests/animations.test.mjs

      - name: Previous-launches outcome + panel tests
        run: node tests/previous.test.mjs

      - name: Previous-launch rolling store (eviction + recorded weather)
        run: node tests/previous-store.test.mjs

      - name: Feed paging (LL2 100-record cap)
        run: node tests/feed-paging.test.mjs

      - name: Organization accent edges + previous-launch detail
        run: node tests/accents.test.mjs

      - name: Saved-missions drawer
        run: node tests/saved-drawer.test.mjs

      - name: Headless UI / render harness
        run: node tests/headless.test.mjs
