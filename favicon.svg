<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="U.S. Space Mission Control">
  <title>U.S. Space Mission Control</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#141c2e"/>
      <stop offset="1" stop-color="#080c14"/>
    </linearGradient>
    <!-- The trajectory brightens along its length, so the arc reads as motion
         rather than as a static stroke. -->
    <linearGradient id="track" x1="0.15" y1="1" x2="0.9" y2="0.1">
      <stop offset="0" stop-color="#4a6fa5" stop-opacity="0.3"/>
      <stop offset="0.45" stop-color="#7cbcff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#eaf3ff"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#cfe6ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#73b6ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="inside">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#tile)"/>

  <g clip-path="url(#inside)">
    <!-- Planet limb. Present for context at large sizes, and quiet enough to
         disappear cleanly at 16px rather than muddying the mark. -->
    <circle cx="32" cy="99" r="53" fill="#101828"/>
    <circle cx="32" cy="99" r="53" fill="none" stroke="#3f5f8f" stroke-opacity="0.85" stroke-width="1.6"/>

    <!-- Two stars, large enough to survive downscaling. The old mark had four
         at r=1.2, which vanished entirely in a browser tab. -->
    <circle cx="13" cy="15" r="1.9" fill="#dbe7fa" fill-opacity="0.9"/>
    <circle cx="47" cy="33" r="1.5" fill="#9fc4f2" fill-opacity="0.7"/>

    <!-- The mark itself: an ascending launch trajectory. One bold shape, which
         is the only thing that survives at tab size. -->
    <path
      d="M11 55 C 13 34, 24 18, 47 13"
      fill="none"
      stroke="url(#track)"
      stroke-width="5.5"
      stroke-linecap="round"
    />

    <!-- The vehicle at the leading end, with a halo so it reads as the source
         of the track rather than as a bead on the end of it. -->
    <circle cx="47" cy="13" r="11" fill="url(#halo)"/>
    <circle cx="47" cy="13" r="4.4" fill="#f4f9ff"/>
  </g>
</svg>
